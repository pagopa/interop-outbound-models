name: Publish
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Verify tag matches package.json version
        id: verify-tag-matches-package-version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          PACKAGE_VERSION=$(jq -r '.version' ./package.json)
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag '$TAG' does not match package.json version '$PACKAGE_VERSION'"
            exit 1
          fi

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - run: pnpm i --frozen-lockfile

      - run: pnpm generate-protobuf

      - run: pnpm build

      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' ./package.json)
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            npm publish --provenance --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public
          fi
